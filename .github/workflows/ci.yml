# Required checks for every PR. Same commands as local: tools come from uv.lock, recipes from the justfile.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: uv sync --locked
      - name: Lint (pre-commit, all files)
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure
      # The pre-commit gitleaks hook scans staged changes only, so CI scans the commits instead.
      - name: Secrets in this PR's commits (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -sSfL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          if git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then range="${BASE_SHA}..HEAD"; else range="HEAD"; fi
          ./gitleaks git --no-banner --redact --log-opts="$range" .

  # She runs Windows; macOS is supported from v1 (docs/adr/0002). The same tests on all three.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    # `uv run` would otherwise sync the default groups, lint tools included, before every command.
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: false
      - run: uv sync --locked --no-default-groups --group test
      - name: Tests
        run: uv run --locked just test

  # The install line on a runner with no uv, from this checkout instead of a Release (install.ps1, install.sh).
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      ALDI_SOURCE: ${{ github.workspace }}
      ALDI_REPORT_TOKEN: not-a-token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows PowerShell 5.1, as on her laptop, running the script the way `irm | iex` does.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: Get-Content -Raw -Encoding UTF8 install.ps1 | Invoke-Expression
      - name: Install (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: sh < install.sh
      - name: The launcher, the token and the app are there
        shell: bash
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/Aldi.lnk"
            test -f "$LOCALAPPDATA/Aldi/settings.json"
          else
            test -x /Applications/Aldi.app/Contents/MacOS/Aldi || test -x "$HOME/Applications/Aldi.app/Contents/MacOS/Aldi"
            test -f "$HOME/Library/Application Support/Aldi/settings.json"
          fi
          "$HOME/.local/bin/aldi" --help
