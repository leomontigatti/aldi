# Weekly, after a 7-day cooldown on new releases; minor/patch grouped into one PR per ecosystem.
# Titles carry a Conventional Commit prefix so they pass the PR title check.
# A dependency bump reaches her laptop with the next release, so each one waits for CI on all three systems.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      python:
        update-types: [minor, patch]
