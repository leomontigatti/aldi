[project]
name = "aldi"
version = "0.0.0"
description = "Translate English or Portuguese PDFs to Spanish, keeping figures and, where it can, the layout"
readme = "README.md"
# pdf2zh-next supports up to 3.13; one version everywhere, the one `.python-version` names.
requires-python = "==3.12.*"
dependencies = [
    "google-genai>=1.0",
    "platformdirs>=4.0",
    "pydantic>=2.0",
    # pdf2zh-next 2.9.0 (Mantener el diseño) requires pymupdf<1.25.3: pinned now so that ticket adds no downgrade.
    "pymupdf<1.25.3",
    "pypandoc-binary>=1.13",
    "typst>=0.13",
]

[project.scripts]
aldi = "aldi.app:main"

# `test` is all CI's Windows and macOS jobs install; `lint` runs on Linux only.
[dependency-groups]
test = [
    "rust-just>=1.58",
    "pytest>=9.0",
]
lint = [
    "pre-commit>=4.6",
    "ruff>=0.16",
    "shellcheck-py>=0.11",
    "actionlint-py>=1.7.12",
    "zizmor>=1.30",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["test", "lint"]
# Quarantine: skip artifacts uploaded in the last 3 days (supply-chain buffer, as in en-escena).
exclude-newer = "3 days"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "C90", "F", "UP", "I", "B", "PTH"]

[tool.ruff.lint.isort]
# Tests import their builders from `conftest`; without this, ruff sorts it as first- or third-party depending on
# whether `tests/conftest.py` is among the files it was given, so pre-commit on staged files and on all disagree.
known-first-party = ["aldi", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-q"]
# PyMuPDF's SWIG bindings warn on import under Python 3.12; nothing to act on.
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
